<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="qrGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Rounded Background -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bgGrad)" stroke="#334155" stroke-width="4"/>

  <!-- Subtle glow ring -->
  <rect x="28" y="28" width="456" height="456" rx="96" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.6"/>

  <!-- Top-Left Target Finder -->
  <rect x="96" y="96" width="112" height="112" rx="20" fill="none" stroke="url(#accentGrad)" stroke-width="16" />
  <rect x="132" y="132" width="40" height="40" rx="8" fill="url(#accentGrad)" />

  <!-- Top-Right Target Finder -->
  <rect x="304" y="96" width="112" height="112" rx="20" fill="none" stroke="url(#accentGrad)" stroke-width="16" />
  <rect x="340" y="132" width="40" height="40" rx="8" fill="url(#accentGrad)" />

  <!-- Bottom-Left Target Finder -->
  <rect x="96" y="304" width="112" height="112" rx="20" fill="none" stroke="url(#accentGrad)" stroke-width="16" />
  <rect x="132" y="340" width="40" height="40" rx="8" fill="url(#accentGrad)" />

  <!-- QR Center Decorative Data Matrix & Galla Stylized Center -->
  <rect x="236" y="96" width="40" height="40" rx="8" fill="url(#qrGrad)" />
  <rect x="236" y="168" width="40" height="40" rx="8" fill="url(#qrGrad)" />
  <rect x="96" y="236" width="40" height="40" rx="8" fill="url(#qrGrad)" />
  <rect x="168" y="236" width="40" height="40" rx="8" fill="url(#qrGrad)" />

  <!-- Bottom-Right Dynamic Nodes -->
  <rect x="236" y="236" width="40" height="40" rx="8" fill="url(#accentGrad)" />
  <rect x="304" y="236" width="40" height="40" rx="8" fill="url(#qrGrad)" />
  <rect x="376" y="236" width="40" height="40" rx="8" fill="url(#accentGrad)" />
  <rect x="236" y="304" width="40" height="40" rx="8" fill="url(#qrGrad)" />
  <rect x="236" y="376" width="40" height="40" rx="8" fill="url(#accentGrad)" />
  <rect x="304" y="304" width="40" height="40" rx="8" fill="url(#accentGrad)" />
  <rect x="376" y="304" width="40" height="40" rx="8" fill="url(#qrGrad)" />
  <rect x="304" y="376" width="40" height="40" rx="8" fill="url(#qrGrad)" />
  <rect x="376" y="376" width="40" height="40" rx="8" fill="url(#accentGrad)" />
</svg>

